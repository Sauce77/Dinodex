<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinosaurio</title>
    {% include '_bootstrap.html' %}
</head>
<body>
    {% include '_navbar.html' %}
    <div class="container">
        <div class="row">
            <h1>{{ dinosaurio.nombre }}</h1>
        </div>
        <div class="row">
            <div class="col p-2 m-1">
                <img src="{{ dinosaurio.imagen.url }}" class="img-fluid" alt="No image">
            </div>
            <div class="col p-2 m-2">
                <div class="row">
                    <div class="col">
                        <p>{{ dinosaurio.descripcion }}</p>    
                    </div>
                </div>
                <div class="row">

                    <div class="col">
                        <button class="btn btn-primary">Rugido</button>
                    </div>

                    <div class="col">
                        <div class="card" style="width: 10rem;">
                            <img src="{{ dinosaurio.alimentacion.imagen.url }}" class="card-img-top" alt="No image">
                            <div class="card-body">
                                <h5>{{ dinosaurio.alimentacion.nombre }}</h5>
                                <p class="card-text">{{ dinosaurio.alimento.descripcion }}</p>
                            </div>
                          </div>
                    </div>

                    <div class="col">
                        <button class="btn btn-primary">Escuchar</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
