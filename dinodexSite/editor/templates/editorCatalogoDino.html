<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar</title>
    {% include '_bootstrap.html' %}
</head>
<body>
    {% include '_navbar.html' %}
    <div class="container">
        <div class="row m-2">
            <h1>Bienvenido, {{usuario.first_name}}</h1>
            <a href="{% url 'editorAgregarDino' %}" class="btn btn-primary" style="width: 10%;">Agregar</a>
        </div>
        
        {% for fila in dinosaurios %}
            <div class="row">
                {% for dino in fila %}
                    <div class="col">
                        <div class="card" style="width: 18rem;">
                            <img src="{{ dino.imagen.url }}" class="card-img-top img-fluid" alt="No image">
                            <div class="card-body">
                              <form method="post" class="text-center">
                                {% csrf_token %}
                                {{ dino.form.nombre }}
                                <button type="submit" class="btn btn-primary" name="editar" value="Editar">Editar</button>
                                <button type="submit" class="btn btn-danger" name="eliminar" value="Eliminar">Eliminar</button>
                              </form>
                            </div>
                          </div>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
    </div>
</body>
</html>
