<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>
<body>
    <style>
        .formPerfil{
            background-color: transparent;
            border-style: none;
            font-size: 1rem;
            width: 60%;
            padding: 1rem;
            margin: .8rem;
        }
    </style>
    <h1>¿Quién eres tú?</h1>
    {% for form in forms %}
        <form method="POST">
            {% csrf_token %}
            {{ form.nombre }}
            {{ form.descripcion }}
            <button type="submit">Siguiente</button>
        </form>
    {% endfor %}
</body>
</html>
