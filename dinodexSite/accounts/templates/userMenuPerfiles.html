 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'uMP.css' %}">
</head>
<body>
   
  <div class="userMenuPerfiles1" id="screen1">
    <div class="container d-flex justify-content-center align-items-center" style="gap: 100px;">
        <!-- Estrellas izquierda -->
        <div class="d-flex">
            <div class="star mb-2" id="star1">
                <img src="{% static 'star.png' %}" alt="Estrella">
            </div>
        </div>
        <div class="d-flex">
            <div class="star mb-2">
                <img src="{% static 'star.png' %}" alt="Estrella">
            </div>
        </div>
        
        <!-- Logo en el centro -->
        <div class="logo text-center">
            <img src="{% static 'logo.png' %}" alt="Logo">
        </div>
        
        <!-- Estrellas derecha -->
        <div class="d-flex">
            <div class="star mb-2">
                <img src="{% static 'star.png' %}" alt="Estrella">
            </div>
        </div>
        <div class="d-flex">
            <div class="star mb-2" id="star4">
                <img src="{% static 'star.png' %}" alt="Estrella">
            </div>
        </div>
    </div>
    <button id="startButton">EMPECEMOS
        <span class="arrow">→</span>
    </button>
</div>

<div class="userMenuPerfiles2" id="screen2" style="display: none;">
    <h1 class="text-center mb-4">Selecciona tu Perfil</h1>
    <div class="container">
        <div class="row">
            <!-- Columna 1 -->
            <div class="col-md-4 text-center">
                <img src="{% static 'alumno.png' %}" alt="Perfil 1" class="img-fluid mb-3">
                <button class="btn btn-primary profile-option">Alumno 
                    <span class="arrow">→</span>
                </button>
                
            </div>
            <!-- Columna 2 -->
            <div class="col-md-4 text-center">
                <img src="{% static 'explora.png' %}" alt="Perfil 2" class="img-fluid mb-3">
                <button class="btn btn-primary profile-option">Explora!
                    <span class="arrow">→</span>
                </button>
            </div>
            <!-- Columna 3 -->
            <div class="col-md-4 text-center">
                <img src="{% static 'docente.png' %}" alt="Perfil 3" class="img-fluid mb-3">
                <button class="btn btn-primary profile-option">Docente
                    <span class="arrow">→</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
  document.getElementById('startButton').addEventListener('click', function () {
    const firstScreen = document.getElementById('screen1');
    const secondScreen = document.getElementById('screen2');
    const startButton = document.getElementById('startButton');

    // Añade la clase para animar la desaparición de la primera pantalla
    firstScreen.classList.add('shrink');

    startButton.style.display = 'none';

    // Asegúrate de que screen2 se muestre después de que termine la animación
    setTimeout(() => {
        secondScreen.style.display = 'flex'; // Muestra la segunda pantalla con flex
        secondScreen.classList.add('show');
    }, 1000); // Tiempo sincronizado con la duración de la animación CSS
});
 
</script>
</body>
</html>
