{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'uS.css' %}">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 w-100" style="max-width: 400px;">
            <div class="text-center mb-4">
                <img src="{% static 'logo.png' %}" alt="DinoDex Logo" class="img-fluid">
            </div>
            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" name="iniciar" value="Iniciar" class="btn btn-primary w-100">Iniciar Sesión <span class="arrow">→</span></button>
            </form>
            <div class="mt-4 text-center">
                <hr>
                    {% for perfil in perfiles %}
                    <form method="post">
                        <div class="input-group mb-3">
                            {% csrf_token %}
                            <button class="btn btn-outline-secondary" name="registrar" value="Registrar">Registrarse</button>
                            {{ perfil.nombre }}
                        </div>
                    </form>
                    {% endfor %}
                <a href="{% url 'userCatalogo' %}" class="d-block mt-2">Ir al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
