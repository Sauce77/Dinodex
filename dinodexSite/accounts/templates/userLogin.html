{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'uS.css' %}">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 w-100" style="max-width: 400px;">
            <div class="text-center mb-4">
                <img src="{% static 'logo.png' %}" alt="DinoDex Logo" class="img-fluid">
            </div>
            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" class="form-control" placeholder="Usuario">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión <span class="arrow">→</span></button>
            </form>
            <div class="mt-4 text-center">
                <hr>
                <button class="btn btn-dark w-100 mb-2">Registrarse como Docente</button>
                <button class="btn btn-dark w-100 mb-2">Registrarse como Alumno</button>
                <a href="#" class="d-block mt-2">Ir al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
